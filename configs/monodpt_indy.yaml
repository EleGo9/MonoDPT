random_seed: 444
logdir: &log_dir "/media/matte/data/pinim/export/logs"
fp16: True
world_size: 1
gpus_per_node: 1

dataset:
  type: &dataset_type 'INDY'
  root_dir: '/home/matte/MonoDPT/'
  root_dir_train: [
    '/media/matte/data/pinim/export/training',
            ]
  root_dir_test: [
            "/media/matte/data/pinim/export/testing",
            ]
  train_split: 'train'
  test_split: 'val'
  batch_size: 1
  use_3d_center: True
  class_merging: False
  use_dontcare: False
  bbox2d_type: 'anno'  # 'proj' or 'anno'
  meanshape: False  # use predefined anchor or not
  writelist: ['Car']
  clip_2d: False
  depth_threshold: 120
  distortion: True

  aug_pd: True
  aug_crop: True

  random_flip: 0.5
  random_crop: 0.5
  random_mixup3d: 0.5
  scale: 0.05
  shift: 0.05

  depth_scale: 'normal'

model_name: 'monodgp'
model:
  num_classes: 3
  return_intermediate_dec: True
  device: 'cuda'

  # Backbone
  backbone: 'dinov2_vits'
  use_dpt_head: True
  train_backbone: True
  num_feature_levels: 3
  dilation: False
  position_embedding: 'sine'  # 'sine' or 'learned'
  masks: False

  # Depth predictor
  mode: LID
  num_depth_bins: 80
  depth_min: 1e-3
  depth_max: 60.0

  # Transformer
  with_box_refine: True
  use_dn: False
  init_box: False
  enc_layers: 3
  dec_layers: 3
  hidden_dim: 256
  dim_feedforward: 256
  dropout: 0.1
  nheads: 8
  num_queries: 50
  group_num: 11
  enc_n_points: 4
  dec_n_points: 4
  # DN
  scalar: 5
  label_noise_scale: 0.2
  box_noise_scale: 0.4
  num_patterns: 0
  # Loss
  aux_loss: True

  # Loss coefficients
  cls_loss_coef: 2
  focal_alpha: 0.25

  bbox_loss_coef: 5
  giou_loss_coef: 2
  3dcenter_loss_coef: 10
  dim_loss_coef: 1
  angle_loss_coef: 1
  depth_loss_coef: 1
  depth_map_loss_coef: 0
  region_loss_coef: 1

  # Matcher
  set_cost_class: 2
  set_cost_bbox: 5
  set_cost_giou: 2
  set_cost_3dcenter: 10


optimizer:
  type: 'adamw'
  lr: 0.0002
  weight_decay: 0.0001


lr_scheduler:
  decay: 'poly'  # 'step', 'cos' or None
  warmup: 'linear'  # 'linear', 'cos', or None
  #decay_rate: 0.5 # only for 'step' decay
  #decay_list: [85, 125, 165, 205] # only for 'step' decay
  warmup_epochs: 5
  warmup_init_lr: 1.0e-06
  min_decay_lr: 1.0e-06


trainer:
  max_epoch: 250
  gpu_ids: '1'
  save_frequency: 1  # checkpoint save interval (in epoch)
  # resume_model: "glorious-pond-3"
  #pretrain_model: "/home/carmelo/RICERCA/DET3D/MonoDGP/logs/checkpoints/dummy-69c79ofe/checkpoint.pth"
  depthany_model: "/home/matte/MonoDPT/depth_anything_v2_vits.pth" 
  save_all: False  # False for only savng the best and latest ckpts
  use_dn: False
  scalar: 5
  label_noise_scale: 0.2
  box_noise_scale: 0.4
  num_patterns: 0
  accum_iter: 4

tester:
  type: *dataset_type
  mode: single  # 'single' or 'all'; 'all' to evaluate all ckpts in the folder
  checkpoint: 195  # the start ckpt epoch for 'all'
  threshold: 0.0  # confidence filter (DEFAULT: 0.2, 0.0 ONLY DEBUG)
  topk: 50
